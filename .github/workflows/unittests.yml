name: Unit Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.11.0
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S QSimplePOSTEST `
            -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Run Unit Tests
        shell: pwsh
        run: |
          $env:PATH = "${{ env.QT_ROOT_DIR }}\bin;$env:PATH"
          .\build\Release\QSimplePOSTEST.exe -v2
