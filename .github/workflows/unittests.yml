name: Unit Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Download QtMsBuild Targets
      run: git clone https://code.qt.io/qt-labs/vstools.git

    - name: Build QtVsTools.RegExpr
      run: |
        $solutionDir = (Resolve-Path .\vstools).Path + '\'
        msbuild .\vstools\QtVsTools.RegExpr\QtVsTools.RegExpr.csproj /p:Configuration=Release /p:Platform=AnyCPU /p:SolutionDir="$solutionDir"
      shell: pwsh

    - name: Generate qt_tasks.targets
      run: |
        $buildConfiguration = 'Release'
        $solutionDir = (Resolve-Path .\vstools).Path + '\'
        $ttInput = Join-Path $solutionDir 'QtMSBuild\QtMsBuild\qt_tasks.targets_TT'
        $commonInput = Join-Path $solutionDir 'common.tt'
        $ttTempDir = Join-Path $env:RUNNER_TEMP 'qtmsbuild-tt'
        $ttTemp = Join-Path $ttTempDir 'qt_tasks.targets_TT'
        $commonTemp = Join-Path $ttTempDir 'common.tt'
        $ttOutput = Join-Path $solutionDir 'QtMSBuild\QtMsBuild\qt_tasks.targets'

        if (-not (Test-Path $ttInput)) { throw "Template file not found at $ttInput" }
        if (-not (Test-Path $commonInput)) { throw "Template include not found at $commonInput" }
        New-Item -ItemType Directory -Path $ttTempDir -Force | Out-Null

        $ttContent = (Get-Content $ttInput -Raw)
        $ttContent = $ttContent.Replace('$(SolutionDir)\common.tt', $commonTemp)
        $ttContent = $ttContent.Replace('$(SolutionDir)', $solutionDir)
        $ttContent = $ttContent.Replace('$(Configuration)', $buildConfiguration)
        if ($ttContent -match '\$\(SolutionDir\)' -or $ttContent -match '\$\(Configuration\)') {
          throw "Template variable replacement for qt_tasks.targets_TT was incomplete."
        }
        Set-Content $ttTemp -Value $ttContent -Encoding UTF8

        $commonContent = (Get-Content $commonInput -Raw)

        $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
        if (-not $programFilesX86) { $programFilesX86 = $env:ProgramFiles }
        if (-not $programFilesX86) { throw "Unable to resolve Program Files path." }

        $vswhereCandidates = @(
          (Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'),
          (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\Installer\vswhere.exe')
        )
        $vswhere = $vswhereCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $vswhere) { throw "vswhere.exe not found." }
        $vsPath = & $vswhere -latest -products * -property installationPath
        if (-not $vsPath) { throw "Unable to locate Visual Studio installation path." }

        $publicAssembliesDir = Join-Path $vsPath 'Common7\IDE\PublicAssemblies'
        $interopDll = Join-Path $publicAssembliesDir 'Microsoft.VisualStudio.Interop.dll'
        $envDteDll = Join-Path $publicAssembliesDir 'EnvDTE.dll'
        $shellInteropDll = Join-Path $publicAssembliesDir 'Microsoft.VisualStudio.Shell.Interop.dll'
        if (-not (Test-Path $interopDll)) { throw "Missing Microsoft.VisualStudio.Interop.dll at $interopDll" }
        if (-not (Test-Path $envDteDll)) { throw "Missing EnvDTE.dll at $envDteDll" }
        if (-not (Test-Path $shellInteropDll)) { throw "Missing Microsoft.VisualStudio.Shell.Interop.dll at $shellInteropDll" }

        $commonContent = $commonContent.Replace('$(AssemblyRef_Microsoft_VisualStudio_Interop)', $interopDll)
        $commonContent = $commonContent.Replace('$(AssemblyRef_EnvDTE)', $envDteDll)
        $commonContent = $commonContent.Replace('$(VsSdk_Shell_Interop)', $shellInteropDll)
        if ($commonContent -match '\$\(AssemblyRef_Microsoft_VisualStudio_Interop\)' -or
            $commonContent -match '\$\(AssemblyRef_EnvDTE\)' -or
            $commonContent -match '\$\(VsSdk_Shell_Interop\)') {
          throw "Template variable replacement for common.tt was incomplete."
        }
        Set-Content $commonTemp -Value $commonContent -Encoding UTF8

        $devEnvDir = Join-Path $vsPath 'Common7\IDE\'
        $vcTargetsPath = Join-Path $vsPath 'MSBuild\Microsoft\VC\v170\'

        $textTransform = Join-Path $vsPath 'Common7\IDE\TextTransform.exe'
        if (-not (Test-Path $textTransform)) { throw "TextTransform.exe not found at $textTransform" }

        & $textTransform `
          -a "!!SolutionDir!$solutionDir" `
          -a "!!DevEnvDir!$devEnvDir" `
          -a "!!Configuration!$buildConfiguration" `
          -a "!!VisualStudioVersion!17.0" `
          -a "!!VCTargetsPath!$vcTargetsPath" `
          -out $ttOutput $ttTemp
        if ($LASTEXITCODE -ne 0) { throw "TextTransform.exe failed with exit code $LASTEXITCODE" }
        if (-not (Test-Path $ttOutput)) { throw "qt_tasks.targets was not generated." }
      shell: pwsh

    - name: Build the solution
      env:
        QtMsBuild: ${{ github.workspace }}\vstools\QtMSBuild\QtMsBuild
      run: |
        msbuild QSimplePOS.sln /p:Configuration=Release /p:Platform=x64 /p:QtInstall="$env:QT_ROOT_DIR"
      shell: pwsh
      
    - name: Run Unit Tests
      run: .\x64\Release\QSimplePOSTEST.exe
